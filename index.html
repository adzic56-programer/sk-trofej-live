<!DOCTYPE html> 
<html> 
<head> 
  <base target="_top"> 
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <style> 
    * { 
      box-sizing: border-box; 
    } 
 
    html { 
      background: #06111d; 
      scroll-behavior: auto; 
    } 
 
    body { 
      margin: 0; 
      background: 
        radial-gradient( 
          circle at 50% 0%, 
          #10283d 0%, 
          #071521 38%, 
          #040d17 100% 
        ); 
      color: #f1f5f9; 
      font-family: Arial, Helvetica, sans-serif; 
      overflow-x: hidden; 
    } 
 
    /* ================================================== 
       GLAVNA STRANA 
       ================================================== */ 
    .page { 
      width: 100%; 
      max-width: 1450px; 
      margin: 0 auto; 
      padding: 22px 34px 100px; 
    } 
 
    /* ================================================== 
       HEADER 
       ================================================== */ 
    .top-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      gap: 25px; 
      margin-bottom: 32px; 
    } 
 
    .brand { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
    } 
 
    /* ================================================== 
       NIŠAN 
       ================================================== */ 
    .target-icon { 
      position: relative; 
      width: 65px; 
      height: 65px; 
      flex: 0 0 65px; 
    } 
 
    .target-circle { 
      position: absolute; 
      left: 6px; 
      top: 6px; 
      width: 53px; 
      height: 53px; 
      border: 4px solid #f3f7fa; 
      border-radius: 50%; 
    } 
 
    .target-circle::after { 
      content: ""; 
      position: absolute; 
      left: 50%; 
      top: 50%; 
      transform: translate(-50%, -50%); 
      width: 9px; 
      height: 9px; 
      background: #f3f7fa; 
      border-radius: 50%; 
    } 
 
    .target-horizontal { 
      position: absolute; 
      left: 0; 
      top: 30px; 
      width: 65px; 
      height: 4px; 
      background: #f3f7fa; 
    } 
 
    .target-vertical { 
      position: absolute; 
      left: 30px; 
      top: 0; 
      width: 4px; 
      height: 65px; 
      background: #f3f7fa; 
    } 
 
    /* ================================================== 
       NASLOV 
       ================================================== */ 
    .brand-text h1 { 
      margin: 0; 
      font-size: clamp(38px, 4.7vw, 66px); 
      line-height: .95; 
      font-weight: 900; 
      letter-spacing: -2px; 
      text-transform: uppercase; 
    } 
 
    .subtitle { 
      margin-top: 10px; 
      color: #86a5bd; 
      font-size: 11px; 
      letter-spacing: 3px; 
      text-transform: uppercase; 
    } 
 
    /* ================================================== 
       UŽIVO 
       ================================================== */ 
    .live { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      background: #ff3154; 
      color: white; 
      padding: 12px 17px; 
      border-radius: 9px; 
      font-size: 14px; 
      font-weight: 900; 
      white-space: nowrap; 
      box-shadow: 0 5px 20px rgba(255, 49, 84, .18); 
    } 
 
    .live-dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: white; 
      animation: blink 1.1s infinite; 
    } 
 
    @keyframes blink { 
      0%, 45% { opacity: 1; } 
      50%, 100% { opacity: .25; } 
    } 
 
    /* ================================================== 
       STATUS 
       ================================================== */ 
    .status { 
      color: #637e94; 
      font-size: 11px; 
      margin: 0 0 17px 2px; 
    } 
 
    /* ================================================== 
       KATEGORIJA 
       ================================================== */ 
    .category { 
      margin-bottom: 38px; 
    } 
 
    .category-title { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 11px; 
      padding-left: 12px; 
      border-left: 5px solid #55c7f2; 
    } 
 
    .category-title h2 { 
      margin: 0; 
      color: #55c7f2; 
      font-size: clamp(20px, 2vw, 27px); 
      line-height: 1; 
      font-weight: 900; 
      text-transform: uppercase; 
    } 
 
    .category-count { 
      color: #647f94; 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    } 
 
    /* ================================================== 
       TABELA 
       ================================================== */ 
    .table-wrap { 
      width: 100%; 
      overflow: hidden; 
      border: 1px solid #24435b; 
      border-radius: 12px; 
      background: rgba(7, 23, 37, .92); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, .16); 
    } 
 
    table { 
      width: 100%; 
      border-collapse: collapse; 
      table-layout: fixed; 
    } 
 
    th { 
      padding: 11px 16px; 
      background: #071622; 
      color: #8ba6ba; 
      text-align: left; 
      font-size: 11px; 
      font-weight: 800; 
      text-transform: uppercase; 
      border-bottom: 1px solid #25435b; 
    } 
 
    td { 
      padding: 13px 16px; 
      border-bottom: 1px solid #1a3043; 
      font-size: clamp(15px, 1.25vw, 19px); 
      line-height: 1.1; 
    } 
 
    tr:last-child td { 
      border-bottom: 0; 
    } 
 
    /* ================================================== 
       KOLONE 
       ================================================== */ 
    th:nth-child(1), td:nth-child(1) { width: 15%; text-align: center; } 
    th:nth-child(2), td:nth-child(2) { width: 39%; text-align: left; } 
    th:nth-child(3), td:nth-child(3) { width: 15%; text-align: center; } 
    th:nth-child(4), td:nth-child(4) { width: 14%; text-align: center; } 
    th:nth-child(5), td:nth-child(5) { width: 17%; text-align: center; } 
 
    /* ================================================== 
       ĆELIJE 
       ================================================== */ 
    td.place { color: #d7e2eb; font-weight: 900; text-align: center; } 
    td.name { font-weight: 800; text-align: left; } 
    td.number { font-variant-numeric: tabular-nums; text-align: center; } 
    td.score { font-size: clamp(21px, 1.8vw, 30px); font-weight: 900; color: #ffffff; font-variant-numeric: tabular-nums; text-align: center; } 
 
    /* ================================================== 
       PLASMANI BOJE 
       ================================================== */ 
    tr.first { background: rgba(85, 199, 242, .13); } 
    tr.first td { border-bottom-color: rgba(85, 199, 242, .24); } 
    tr.first td.score { background: #55c7f2; color: #04131d; font-weight: 900; } 
    tr.second { background: rgba(255, 255, 255, .025); } 
    .medal { margin-right: 5px; font-size: 16px; } 
    .empty { padding: 20px; text-align: center; color: #60778a; font-size: 12px; } 
 
    /* ================================================== 
       TV MODIFIKATORI 
       ================================================== */ 
    .tv-indicator { position: fixed; left: 12px; bottom: 12px; z-index: 9999; padding: 6px 9px; border: 1px solid #203a50; border-radius: 6px; background: rgba(5, 15, 25, .9); color: #637c90; font-size: 10px; opacity: .04; transition: opacity .2s; } 
    .tv-indicator:hover { opacity: .9; } 
    .tv-controls { position: fixed; right: 12px; bottom: 12px; z-index: 9999; display: flex; gap: 5px; opacity: .04; transition: opacity .2s; } 
    .tv-controls:hover { opacity: .9; } 
    .tv-controls button { height: 32px; padding: 0 10px; border: 1px solid #34516a; border-radius: 6px; background: rgba(5, 15, 25, .95); color: #dce7ef; font-size: 10px; cursor: pointer; font-weight: bold; } 
    .designer-credit { text-align: center; margin-top: 25px; padding: 12px 0 20px; font-size: 13px; opacity: 0.6; }
  </style> 
</head>
