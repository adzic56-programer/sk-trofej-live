<!DOCTYPE html> 
<html> 
<head> 
  <base target="_top"> 
  <meta name="viewport" content="width=device-width, initial-scale=1"> 
  <style> 
    * { 
      box-sizing: border-box; 
    } 
 
    html { 
      background: #06111d; 
      scroll-behavior: auto; 
    } 
 
    body { 
      margin: 0; 
      background: 
        radial-gradient( 
          circle at 50% 0%, 
          #10283d 0%, 
          #071521 38%, 
          #040d17 100% 
        ); 
      color: #f1f5f9; 
      font-family: Arial, Helvetica, sans-serif; 
      overflow-x: hidden; 
    } 
 
    /* ================================================== 
       GLAVNA STRANA 
       ================================================== */ 
    .page { 
      width: 100%; 
      max-width: 1450px; 
      margin: 0 auto; 
      padding: 22px 34px 100px; 
    } 
 
    /* ================================================== 
       HEADER 
       ================================================== */ 
    .top-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-start; 
      gap: 25px; 
      margin-bottom: 32px; 
    } 
 
    .brand { 
      display: flex; 
      align-items: center; 
      gap: 14px; 
    } 
 
    /* ================================================== 
       NIŠAN 
       ================================================== */ 
    .target-icon { 
      position: relative; 
      width: 65px; 
      height: 65px; 
      flex: 0 0 65px; 
    } 
 
    .target-circle { 
      position: absolute; 
      left: 6px; 
      top: 6px; 
      width: 53px; 
      height: 53px; 
      border: 4px solid #f3f7fa; 
      border-radius: 50%; 
    } 
 
    .target-circle::after { 
      content: ""; 
      position: absolute; 
      left: 50%; 
      top: 50%; 
      transform: translate(-50%, -50%); 
      width: 9px; 
      height: 9px; 
      background: #f3f7fa; 
      border-radius: 50%; 
    } 
 
    .target-horizontal { 
      position: absolute; 
      left: 0; 
      top: 30px; 
      width: 65px; 
      height: 4px; 
      background: #f3f7fa; 
    } 
 
    .target-vertical { 
      position: absolute; 
      left: 30px; 
      top: 0; 
      width: 4px; 
      height: 65px; 
      background: #f3f7fa; 
    } 
 
    /* ================================================== 
       NASLOV 
       ================================================== */ 
    .brand-text h1 { 
      margin: 0; 
      font-size: clamp(38px, 4.7vw, 66px); 
      line-height: .95; 
      font-weight: 900; 
      letter-spacing: -2px; 
      text-transform: uppercase; 
    } 
 
    .subtitle { 
      margin-top: 10px; 
      color: #86a5bd; 
      font-size: 11px; 
      letter-spacing: 3px; 
      text-transform: uppercase; 
    } 
 
    /* ================================================== 
       UŽIVO 
       ================================================== */ 
    .live { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      background: #ff3154; 
      color: white; 
      padding: 12px 17px; 
      border-radius: 9px; 
      font-size: 14px; 
      font-weight: 900; 
      white-space: nowrap; 
      box-shadow: 0 5px 20px rgba(255, 49, 84, .18); 
    } 
 
    .live-dot { 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: white; 
      animation: blink 1.1s infinite; 
    } 
 
    @keyframes blink { 
      0%, 45% { opacity: 1; } 
      50%, 100% { opacity: .25; } 
    } 
 
    /* ================================================== 
       STATUS 
       ================================================== */ 
    .status { 
      color: #637e94; 
      font-size: 11px; 
      margin: 0 0 17px 2px; 
    } 
 
    /* ================================================== 
       KATEGORIJA 
       ================================================== */ 
    .category { 
      margin-bottom: 38px; 
    } 
 
    .category-title { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 11px; 
      padding-left: 12px; 
      border-left: 5px solid #55c7f2; 
    } 
 
    .category-title h2 { 
      margin: 0; 
      color: #55c7f2; 
      font-size: clamp(20px, 2vw, 27px); 
      line-height: 1; 
      font-weight: 900; 
      text-transform: uppercase; 
    } 
 
    .category-count { 
      color: #647f94; 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    } 
 
    /* ================================================== 
       TABELA 
       ================================================== */ 
    .table-wrap { 
      width: 100%; 
      overflow: hidden; 
      border: 1px solid #24435b; 
      border-radius: 12px; 
      background: rgba(7, 23, 37, .92); 
      box-shadow: 0 8px 25px rgba(0, 0, 0, .16); 
    } 
 
    table { 
      width: 100%; 
      border-collapse: collapse; 
      table-layout: fixed; 
    } 
 
    th { 
      padding: 11px 16px; 
      background: #071622; 
      color: #8ba6ba; 
      text-align: left; 
      font-size: 11px; 
      font-weight: 800; 
      text-transform: uppercase; 
      border-bottom: 1px solid #25435b; 
    } 
 
    td { 
      padding: 13px 16px; 
      border-bottom: 1px solid #1a3043; 
      font-size: clamp(15px, 1.25vw, 19px); 
      line-height: 1.1; 
    } 
 
    tr:last-child td { 
      border-bottom: 0; 
    } 
 
    /* ================================================== 
       KOLONE 
       ================================================== */ 
    th:nth-child(1), td:nth-child(1) { width: 15%; text-align: center; } 
    th:nth-child(2), td:nth-child(2) { width: 39%; text-align: left; } 
    th:nth-child(3), td:nth-child(3) { width: 15%; text-align: center; } 
    th:nth-child(4), td:nth-child(4) { width: 14%; text-align: center; } 
    th:nth-child(5), td:nth-child(5) { width: 17%; text-align: center; } 
 
    /* ================================================== 
       ĆELIJE 
       ================================================== */ 
    td.place { color: #d7e2eb; font-weight: 900; text-align: center; } 
    td.name { font-weight: 800; text-align: left; } 
    td.number { font-variant-numeric: tabular-nums; text-align: center; } 
    td.score { font-size: clamp(21px, 1.8vw, 30px); font-weight: 900; color: #ffffff; font-variant-numeric: tabular-nums; text-align: center; } 
 
    /* ================================================== 
       PLASMANI BOJE 
       ================================================== */ 
    tr.first { background: rgba(85, 199, 242, .13); } 
    tr.first td { border-bottom-color: rgba(85, 199, 242, .24); } 
    tr.first td.score { background: #55c7f2; color: #04131d; font-weight: 900; } 
    tr.second { background: rgba(255, 255, 255, .025); } 
    .medal { margin-right: 5px; font-size: 16px; } 
    .empty { padding: 20px; text-align: center; color: #60778a; font-size: 12px; } 
 
    /* ================================================== 
       TV MODIFIKATORI 
       ================================================== */ 
    .tv-indicator { position: fixed; left: 12px; bottom: 12px; z-index: 9999; padding: 6px 9px; border: 1px solid #203a50; border-radius: 6px; background: rgba(5, 15, 25, .9); color: #637c90; font-size: 10px; opacity: .04; transition: opacity .2s; } 
    .tv-indicator:hover { opacity: .9; } 
    .tv-controls { position: fixed; right: 12px; bottom: 12px; z-index: 9999; display: flex; gap: 5px; opacity: .04; transition: opacity .2s; } 
    .tv-controls:hover { opacity: .9; } 
    .tv-controls button { height: 32px; padding: 0 10px; border: 1px solid #34516a; border-radius: 6px; background: rgba(5, 15, 25, .95); color: #dce7ef; font-size: 10px; cursor: pointer; font-weight: bold; } 
    .designer-credit { text-align: center; margin-top: 25px; padding: 12px 0 20px; font-size: 13px; opacity: 0.6; }
  </style> 
</head> 
<body> 
 
  <div class="page"> 
      <div class="top-header"> 
        <div class="brand"> 
          <div class="target-icon"> 
            <div class="target-circle"></div> 
            <div class="target-horizontal"></div> 
            <div class="target-vertical"></div> 
          </div> 
          <div class="brand-text"> 
            <h1>SK TROFEJ</h1> 
            <div class="subtitle">PRECIZNOST • KONCENTRACIJA • POBEDA</div> 
          </div> 
        </div> 
        <div class="live"> 
          <span class="live-dot"></span> UŽIVO 
        </div> 
      </div> 
 
      <div class="tv-indicator" id="tvIndicator">TV REŽIM • AUTO SKROL</div> 
 
      <div class="tv-controls"> 
        <button onclick="toggleAutoScroll()">PAUZA</button> 
        <button onclick="resetScroll()">VRH</button> 
        <button onclick="toggleFullscreen()">⛶ EKRAN</button> 
      </div> 
 
      <div class="status" id="liveStatus">Učitavanje podataka sa vatrene linije...</div> 
      <div id="liveResults"></div> 
  </div> 
 
  <script>
 
 
 
    const VIEW = "live"; 
 
 
    let latestResults = {}; 
 
 
    /* ================================================= 
       KATEGORIJE 
       ================================================= */ 
 
    const CATEGORIES = [ 
 
      "Žene - Pištolj", 
 
      "Žene - Revolver", 
 
      "Žene - MK pištolj/revolver", 
 
      "Muškarci - Pištolj", 
 
      "Muškarci - Revolver", 
 
      "Muškarci - MK pištolj/revolver" 
 
    ]; 
 
 
    /* ================================================= 
       POZIV SERVERA 
       ================================================= */ 
 
    function callServer( 
      functionName, 
      ...args 
    ) { 
 
      return new Promise( 
        ( 
          resolve, 
          reject 
        ) => { 
 
          google.script.run 
 
            .withSuccessHandler( 
              resolve 
            ) 
 
            .withFailureHandler( 
              reject 
            ) 
 
            [functionName]( 
              ...args 
            ); 
 
        } 
      ); 
 
    } 
 
 
    
    /* ================================================= 
       UČITAVANJE 
       ================================================= */

    async function loadResults() {

      if (VIEW !== "live") {
        return;
      }

      try {

        const response = await fetch(
          "/api/results",
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            `API greška: ${response.status}`
          );
        }

        const results = await response.json();

        latestResults = results;

        renderLive(results);

        const status =
          document.getElementById(
            "liveStatus"
          );

        if (status) {

          status.textContent =
            "Poslednje osvežavanje: " +
            new Date().toLocaleTimeString(
              "sr-RS"
            );

        }

      } catch (error) {

        console.error(
          "Greška pri učitavanju rezultata:",
          error
        );

        const status =
          document.getElementById(
            "liveStatus"
          );

        if (status) {

          status.textContent =
            "Greška pri učitavanju rezultata.";

        }

      }

    }

    /* ================================================= 
       MEDALJE 
       ================================================= */ 
 
    function medalForPlace( 
      place 
    ) { 
 
      if ( 
        place === 1 
      ) { 
 
        return "🥇"; 
 
      } 
 
 
      if ( 
        place === 2 
      ) { 
 
        return "🥈"; 
 
      } 
 
 
      if ( 
        place === 3 
      ) { 
 
        return "🥉"; 
 
      } 
 
 
      return ""; 
 
    } 
 
 
    /* ================================================= 
       LIVE TABELA 
       ================================================= */ 
 
    function renderLive( 
      results 
    ) { 
 
      const container = 
        document.getElementById( 
          "liveResults" 
        ); 
 
 
      if (!container) { 
 
        return; 
 
      } 
 
 
      let html = ""; 
 
 
      (results.__activeCategories || CATEGORIES).forEach( 
        category => { 
 
          const list = 
            results[ 
              category 
            ] || []; 
 
 
          html += ` 
 
            <section 
              class="category" 
            > 
 
              <div 
                class="category-title" 
              > 
 
                <h2> 
                  ${escapeHtml( 
                    category 
                  )} 
                </h2> 
 
                <div 
                  class="category-count" 
                > 
 
                  ${list.length} 
 
                  ${ 
                    list.length === 1 
                      ? "TAKMIČAR" 
                      : "TAKMIČARA" 
                  } 
 
                </div> 
 
              </div> 
 
          `; 
 
 
          if ( 
            list.length === 0 
          ) { 
 
            html += ` 
 
              <div 
                class="table-wrap" 
              > 
 
                <div 
                  class="empty" 
                > 
                  Još nema rezultata. 
                </div> 
 
              </div> 
 
            `; 
 
          } else { 
 
 
            html += ` 
 
              <div 
                class="table-wrap" 
              > 
 
                <table> 
 
                  <thead> 
 
                    <tr> 
 
                      <th> 
                        PLASMAN 
                      </th> 
 
                      <th> 
                        TAKMIČAR 
                      </th> 
 
                      <th> 
                        KRUGOVI 
                      </th> 
 
                      <th> 
                        MUŠEVI 
                      </th> 
 
                      <th> 
                        REZULTAT 
                      </th> 
 
                    </tr> 
 
                  </thead> 
 
                  <tbody> 
 
            `; 
 
 
            list.forEach( 
              ( 
                item, 
                index 
              ) => { 
 
                const place = 
                  index + 1; 
 
 
                let rowClass = 
                  ""; 
 
 
                if ( 
                  place === 1 
                ) { 
 
                  rowClass = 
                    "first"; 
 
                } else if ( 
                  place === 2 
                ) { 
 
                  rowClass = 
                    "second"; 
 
                } 
 
 
                const medal = 
                  medalForPlace( 
                    place 
                  ); 
 
 
                html += ` 
 
                  <tr 
                    class="${rowClass}" 
                  > 
 
                    <td 
                      class="place" 
                    > 
 
                      ${ 
                        medal 
                          ? `<span class="medal">${medal}</span>` 
                          : "" 
                      } 
 
                      ${place}. 
 
                    </td> 
 
 
                    <td 
                      class="name" 
                    > 
 
                      ${escapeHtml( 
                        item.ime 
                      )} 
 
                    </td> 
 
 
                    <td 
                      class="number" 
                    > 
 
                      ${item.krugovi} 
 
                    </td> 
 
 
                    <td 
                      class="number" 
                    > 
 
                      ${item.musevi} 
 
                    </td> 
 
 
                    <td 
                      class="score" 
                    > 
 
                      ${item.rezultat} 
 
                    </td> 
 
                  </tr> 
 
                `; 
 
              } 
            ); 
 
 
            html += ` 
 
                  </tbody> 
 
                </table> 
 
              </div> 
 
            `; 
 
          } 
 
 
          html += ` 
 
            </section> 
 
          `; 
 
        } 
      ); 
 
 
      container.innerHTML = 
        html; 
 
    } 
 
 
    /* ================================================= 
       ADMIN 
       ================================================= */ 
 
    async function loadAdmin() { 
 
      try { 
 
        const results = 
          await callServer( 
            "getResults" 
          ); 
 
 
        latestResults = 
          results; 
 
        renderAdmin( 
          results 
        ); 
 
 
      } catch (error) { 
 
        showAdminMessage( 
          error.message || 
          String(error), 
          true 
        ); 
 
      } 
 
    } 
 
 
    /* ================================================= 
       ADMIN TABELA 
       ================================================= */ 
 
    function renderAdmin( 
      results 
    ) { 
 
      const tbody = 
        document.getElementById( 
          "adminResults" 
        ); 
 
 
      if (!tbody) { 
 
        return; 
 
      } 
 
 
      const all = []; 
 
 
      CATEGORIES.forEach( 
        category => { 
 
          ( 
            results[ 
              category 
            ] || [] 
          ).forEach( 
            item => { 
 
              all.push( 
                item 
              ); 
 
            } 
          ); 
 
        } 
      ); 
 
 
      if ( 
        all.length === 0 
      ) { 
 
        tbody.innerHTML = ` 
 
          <tr> 
 
            <td 
              colspan="7" 
              class="empty" 
            > 
              Nema unetih rezultata. 
            </td> 
 
          </tr> 
 
        `; 
 
        return; 
 
      } 
 
 
      tbody.innerHTML = 
        all 
          .map( 
            ( 
              item, 
              index 
            ) => { 
 
              return ` 
 
                <tr> 
 
                  <td> 
                    ${index + 1} 
                  </td> 
 
                  <td> 
                    ${escapeHtml( 
                      item.ime 
                    )} 
 
                  </td> 
 
                  <td> 
                    ${escapeHtml( 
                      item.kategorija 
                    )} 
 
                  </td> 
 
                  <td> 
                    ${item.krugovi} 
                  </td> 
 
                  <td> 
                    ${item.musevi} 
                  </td> 
 
                  <td> 
                    <strong> 
                      ${item.rezultat} 
                    </strong> 
                  </td> 
 
                  <td> 
 
                    <button 
                      onclick="editResult('${item.id}')" 
                    > 
                      IZMENI 
                    </button> 
 
                    <button 
                      class="danger" 
                      onclick="deleteResultConfirm('${item.id}')" 
                    > 
                      OBRIŠI 
                    </button> 
 
                  </td> 
 
                </tr> 
 
              `; 
 
            } 
          ) 
          .join(""); 
 
    } 
 
 
    /* ================================================= 
       SAČUVAJ 
       ================================================= */ 
 
    async function saveResult() { 
 
      const password = 
        document 
          .getElementById( 
            "password" 
          ) 
          .value 
          .trim(); 
 
 
      const ime = 
        document 
          .getElementById( 
            "ime" 
          ) 
          .value 
          .trim(); 
 
 
      const kategorija = 
        document 
          .getElementById( 
            "kategorija" 
          ) 
          .value; 
 
 
      const krugovi = 
        document 
          .getElementById( 
            "krugovi" 
          ) 
          .value; 
 
 
      const musevi = 
        document 
          .getElementById( 
            "musevi" 
          ) 
          .value; 
 
 
      const editId = 
        document 
          .getElementById( 
            "editId" 
          ) 
          .value; 
 
 
      if (!password) { 
 
        showAdminMessage( 
          "Unesite admin lozinku.", 
          true 
        ); 
 
        return; 
 
      } 
 
 
      if (!ime) { 
 
        showAdminMessage( 
          "Unesite ime i prezime.", 
          true 
        ); 
 
        return; 
 
      } 
 
 
      const data = { 
 
        ime: 
          ime, 
 
        kategorija: 
          kategorija, 
 
        krugovi: 
          krugovi, 
 
        musevi: 
          musevi 
 
      }; 
 
 
      try { 
 
        showAdminMessage( 
          "Čuvanje..." 
        ); 
 
 
        let results; 
 
 
        if ( 
          editId 
        ) { 
 
          data.id = 
            editId; 
 
 
          results = 
            await callServer( 
              "updateResult", 
              data, 
              password 
            ); 
 
        } else { 
 
          results = 
            await callServer( 
              "addResult", 
              data, 
              password 
            ); 
 
        } 
 
 
        latestResults = 
          results; 
 
 
        renderAdmin( 
          results 
        ); 
 
 
        clearForm(); 
 
 
        showAdminMessage( 
          "Rezultat je uspešno sačuvan." 
        ); 
 
 
      } catch (error) { 
 
        showAdminMessage( 
          error.message || 
          String(error), 
          true 
        ); 
 
      } 
 
    } 
 
 
    /* ================================================= 
       IZMENA 
       ================================================= */ 
 
    function editResult( 
      id 
    ) { 
 
      let item = 
        null; 
 
 
      Object.keys( 
        latestResults 
      ).forEach( 
        category => { 
 
          const found = 
            ( 
              latestResults[ 
                category 
              ] || [] 
            ).find( 
              x => 
                String( 
                  x.id 
                ) === 
                String(id) 
            ); 
 
 
          if (found) { 
 
            item = 
              found; 
 
          } 
 
        } 
      ); 
 
 
      if (!item) { 
 
        return; 
 
      } 
 
 
      document 
        .getElementById( 
          "editId" 
        ) 
        .value = 
        item.id; 
 
 
      document 
        .getElementById( 
          "ime" 
        ) 
        .value = 
        item.ime; 
 
 
      document 
        .getElementById( 
          "kategorija" 
        ) 
        .value = 
        item.kategorija; 
 
 
      document 
        .getElementById( 
          "krugovi" 
        ) 
        .value = 
        item.krugovi; 
 
 
      document 
        .getElementById( 
          "musevi" 
        ) 
        .value = 
        item.musevi; 
 
 
      window.scrollTo({ 
 
        top: 
          0, 
 
        behavior: 
          "smooth" 
 
      }); 
 
    } 
 
 
    /* ================================================= 
       BRISANJE 
       ================================================= */ 
 
    async function deleteResultConfirm( 
      id 
    ) { 
 
      if ( 
        !confirm( 
          "Da li sigurno želite da obrišete ovaj rezultat?" 
        ) 
      ) { 
 
        return; 
 
      } 
 
 
      const password = 
        document 
          .getElementById( 
            "password" 
          ) 
          .value 
          .trim(); 
 
 
      if (!password) { 
 
        showAdminMessage( 
          "Unesite admin lozinku.", 
          true 
        ); 
 
        return; 
 
      } 
 
 
      try { 
 
        const results = 
          await callServer( 
            "deleteResult", 
            id, 
            password 
          ); 
 
 
        latestResults = 
          results; 
 
 
        renderAdmin( 
          results 
        ); 
 
 
        showAdminMessage( 
          "Rezultat je obrisan." 
        ); 
 
 
      } catch (error) { 
 
        showAdminMessage( 
          error.message || 
          String(error), 
          true 
        ); 
 
      } 
 
    } 
 
 
    /* ================================================= 
       NOVI UNOS 
       ================================================= */ 
 
    function clearForm() { 
 
      document 
        .getElementById( 
          "editId" 
        ) 
        .value = 
        ""; 
 
 
      document 
        .getElementById( 
          "ime" 
        ) 
        .value = 
        ""; 
 
 
      document 
        .getElementById( 
          "krugovi" 
        ) 
        .value = 
        ""; 
 
 
      document 
        .getElementById( 
          "musevi" 
        ) 
        .value = 
        ""; 
 
    } 
 
 
    /* ================================================= 
       ADMIN PORUKA 
       ================================================= */ 
 
    function showAdminMessage( 
      text, 
      error 
    ) { 
 
      const el = 
        document.getElementById( 
          "adminMessage" 
        ); 
 
 
      if (!el) { 
 
        return; 
 
      } 
 
 
      el.textContent = 
        text; 
 
 
      el.classList.add( 
        "show" 
      ); 
 
 
      if (error) { 
 
        el.style.background = 
          "#481c1c"; 
 
        el.style.color = 
          "#ffd1d1"; 
 
      } else { 
 
        el.style.background = 
          "#102b3f"; 
 
        el.style.color = 
          "#d1e2ed"; 
 
      } 
 
    } 
 
 
    /* ================================================= 
       TV AUTO SKROL 
       ================================================= */ 
 
    let autoScrollRunning = 
      true; 
 
 
    let autoScrollFrame = 
      null; 
 
 
    let scrollPauseUntil = 
      0; 
 
 
    /* 
      BRZINA: 
 
      80  = sporije 
      100 = normalno 
      120 = brzo 
      140 = još brže 
    */ 
 
    const SCROLL_SPEED = 
      50; 
 
 
    /* 
      Pauza na početku: 
      2 sekunde 
    */ 
 
    const TOP_PAUSE = 
      2000; 
 
 
    /* 
      Pauza na kraju: 
      2 sekunde 
    */ 
 
    const BOTTOM_PAUSE = 
      2000; 
 
 
    function startAutoScroll() { 
 
      if ( 
        VIEW !== "live" 
      ) { 
 
        return; 
 
      } 
 
 
      autoScrollRunning = 
        true; 
 
      scrollPauseUntil = 
        performance.now() + 
        TOP_PAUSE; 
 
      let previousTime = 
        performance.now(); 
 
 
      function loop( 
        currentTime 
      ) { 
 
 
        if ( 
          !autoScrollRunning 
        ) { 
 
          previousTime = 
            currentTime; 
 
          autoScrollFrame = 
            requestAnimationFrame( 
              loop 
            ); 
 
          return; 
 
        } 
 
 
        /* 
          Čekanje na vrhu. 
        */ 
 
        if ( 
          currentTime < 
          scrollPauseUntil 
        ) { 
 
          previousTime = 
            currentTime; 
 
          autoScrollFrame = 
            requestAnimationFrame( 
              loop 
            ); 
 
          return; 
 
        } 
 
 
        const delta = 
          ( 
            currentTime - 
            previousTime 
          ) / 1000; 
 
        previousTime = 
          currentTime; 
 
 
        const maxScroll = 
          document 
            .documentElement 
            .scrollHeight - 
          window.innerHeight; 
 
 
        /* 
          Ako nema dovoljno 
          sadržaja za skrol. 
        */ 
 
        if ( 
          maxScroll <= 5 
        ) { 
 
          autoScrollFrame = 
            requestAnimationFrame( 
              loop 
            ); 
 
          return; 
 
        } 
 
 
        const currentY = 
          window.scrollY; 
 
 
        /* 
          KRAJ STRANICE 
        */ 
 
        if ( 
          currentY >= 
          maxScroll - 2 
        ) { 
 
          autoScrollRunning = 
            false; 
 
 
          setTimeout( 
            () => { 
 
              window.scrollTo({ 
 
                top: 
                  0, 
 
                behavior: 
                  "auto" 
 
              }); 
 
 
              scrollPauseUntil = 
                performance.now() + 
                TOP_PAUSE; 
 
              autoScrollRunning = 
                true; 
 
            }, 
            BOTTOM_PAUSE 
          ); 
 
 
          autoScrollFrame = 
            requestAnimationFrame( 
              loop 
            ); 
 
          return; 
 
        } 
 
 
        /* 
          NORMALNO KRETANJE 
        */ 
 
        window.scrollBy( 
          0, 
          SCROLL_SPEED * 
          delta 
        ); 
 
        autoScrollFrame = 
          requestAnimationFrame( 
            loop 
          ); 
 
      } 
 
 
      if ( 
        autoScrollFrame 
      ) { 
 
        cancelAnimationFrame( 
          autoScrollFrame 
        ); 
 
      } 
 
 
      autoScrollFrame = 
        requestAnimationFrame( 
          loop 
        ); 
 
    } 
 
 
    /* ================================================= 
       PAUZA / NASTAVI 
       ================================================= */ 
 
    function toggleAutoScroll() { 
 
      autoScrollRunning = 
        !autoScrollRunning; 
 
 
      const indicator = 
        document.getElementById( 
          "tvIndicator" 
        ); 
 
 
      const button = 
        document.querySelector( 
          ".tv-controls button" 
        ); 
 
 
      if ( 
        autoScrollRunning 
      ) { 
 
        if (indicator) { 
 
          indicator.textContent = 
            "TV REŽIM • AUTO SKROL"; 
 
        } 
 
 
        if (button) { 
 
          button.textContent = 
            "PAUZA"; 
 
        } 
 
      } else { 
 
        if (indicator) { 
 
          indicator.textContent = 
            "TV REŽIM • PAUZA"; 
 
        } 
 
 
        if (button) { 
 
          button.textContent = 
            "NASTAVI"; 
 
        } 
 
      } 
 
    } 
 
 
    /* ================================================= 
       VRH 
       ================================================= */ 
 
    function resetScroll() { 
 
      window.scrollTo({ 
 
        top: 
          0, 
 
        behavior: 
          "auto" 
 
      }); 
 
 
      autoScrollRunning = 
        false; 
 
      setTimeout( 
        () => { 
 
          scrollPauseUntil = 
            performance.now() + 
            TOP_PAUSE; 
 
          autoScrollRunning = 
            true; 
 
        }, 
        100 
      ); 
 
    } 
 
 
    /* ================================================= 
       CEO EKRAN 
       ================================================= */ 
 
    function toggleFullscreen() { 
 
      if ( 
        !document.fullscreenElement 
      ) { 
 
        document 
          .documentElement 
          .requestFullscreen() 
          .catch( 
            () => {} 
          ); 
 
      } else { 
 
        document 
          .exitFullscreen() 
          .catch( 
            () => {} 
          ); 
 
      } 
 
    } 
 
 
    /* ================================================= 
       ZAŠTITA HTML 
       ================================================= */ 
 
    function escapeHtml( 
      value 
    ) { 
 
      return String( 
        value 
      ) 
 
        .replace( 
          /&/g, 
          "&amp;" 
        ) 
 
        .replace( 
          /</g, 
          "&lt;" 
        ) 
 
        .replace( 
          />/g, 
          "&gt;" 
        ) 
 
        .replace( 
          /"/g, 
          "&quot;" 
        ) 
 
        .replace( 
          /'/g, 
          "&#039;" 
        ); 
 
    } 
 
 
    /* ================================================= 
       START 
       ================================================= */ 
 
    window.addEventListener( 
      "load", 
      () => { 
 
        if ( 
          VIEW === "live" 
        ) { 
 
          /* 
            Rezultati se učitavaju 
            odmah. 
          */ 
 
          loadResults(); 
 
 
          /* 
            Stranica se postavlja 
            na sam vrh. 
 
            Nakon 0.3 sekunde 
            AUTO SKROL KREĆE SAM. 
          */ 
 
          setTimeout( 
            () => { 
 
              window.scrollTo({ 
 
                top: 
                  0, 
 
                behavior: 
                  "auto" 
 
              }); 
 
 
              startAutoScroll(); 
 
            }, 
            300 
          ); 
 
 
        } else { 
 
          loadAdmin(); 
 
        } 
 
      } 
    ); 
 
 
    /* ================================================= 
       LIVE OSVEŽAVANJE 
       ================================================= */ 
 
    if ( 
      VIEW === "live" 
    ) { 
 
      setInterval( 
        loadResults, 
        2000 
      ); 
 
    } 
 
 
  
</script>
